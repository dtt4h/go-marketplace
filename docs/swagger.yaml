info:
  contact: {}
  description: Marketplace backend API for buyers, sellers and admins.
  title: Go Marketplace API
  version: "1.0"
paths:
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Generates a reset token for the given email
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_dtt4h_go-marketplace_internal_server_dtos.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request password reset
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user and returns access + refresh tokens
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_dtt4h_go-marketplace_internal_server_dtos.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_internal_server_dtos.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      description: Deletes all refresh tokens for the current user
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /auth/refresh:
    post:
      description: Rotates refresh token from cookie and returns new access token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_internal_server_dtos.RefreshResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
      summary: Refresh tokens
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a buyer account and returns access + refresh tokens
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_dtt4h_go-marketplace_internal_server_dtos.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_internal_server_dtos.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Resets password using the reset token from forgot-password flow
      parameters:
      - description: Reset token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_dtt4h_go-marketplace_internal_server_dtos.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
      summary: Reset password using token
      tags:
      - auth
  /cart:
    delete:
      description: Removes all items from the current user's cart
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_internal_server_dtos.CartResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Clear cart
      tags:
      - cart
    get:
      description: Returns all items in the current user's shopping cart
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_internal_server_dtos.CartResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user's cart
      tags:
      - cart
  /cart/items:
    post:
      consumes:
      - application/json
      description: Adds a product to the current user's cart (or updates quantity
        if already present)
      parameters:
      - description: Product ID and quantity
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_dtt4h_go-marketplace_internal_server_dtos.AddCartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_internal_server_dtos.CartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add item to cart
      tags:
      - cart
  /cart/items/{itemID}:
    delete:
      description: Removes a specific item from the current user's cart
      parameters:
      - description: Cart item ID
        in: path
        name: itemID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_internal_server_dtos.CartResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove item from cart
      tags:
      - cart
    patch:
      consumes:
      - application/json
      description: Updates the quantity of a specific cart item
      parameters:
      - description: Cart item ID
        in: path
        name: itemID
        required: true
        type: integer
      - description: New quantity
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_dtt4h_go-marketplace_internal_server_dtos.UpdateCartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_internal_server_dtos.CartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update cart item quantity
      tags:
      - cart
  /orders:
    post:
      consumes:
      - application/json
      description: Creates an order from provided items, decrements stock
      parameters:
      - description: Order data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_dtt4h_go-marketplace_internal_server_dtos.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_internal_server_dtos.OrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
      summary: Create an order
      tags:
      - orders
  /orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: Transitions order status (seller or buyer)
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      - description: New status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_dtt4h_go-marketplace_internal_server_dtos.UpdateOrderStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_internal_server_dtos.OrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update order status
      tags:
      - orders
  /orders/me:
    get:
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.PaginatedResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List current user's orders
      tags:
      - orders
  /orders/me/{id}:
    get:
      description: Returns order details (buyer or seller of items in order)
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_internal_server_dtos.OrderResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get order by ID
      tags:
      - orders
  /orders/seller:
    get:
      description: Returns orders containing products from seller's store (seller
        role)
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.PaginatedResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List orders for seller's products
      tags:
      - orders
  /payments:
    post:
      consumes:
      - application/json
      description: Initiates a payment for an order (returns confirmation URL)
      parameters:
      - description: Payment data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_dtt4h_go-marketplace_internal_server_dtos.CreatePaymentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_internal_server_dtos.PaymentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_dtt4h_go-marketplace_pkg_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a payment
      tags:
      - payments
  /payments/{id}:
    get:
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
